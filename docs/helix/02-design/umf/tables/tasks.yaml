# Tempo table spec (UMF TableSpec). Authoritative column and relationship definitions; prose in docs/helix/02-design/data-design.md.
version: "1.0"
table_name: "tasks"
description: "Labels for time within a project (FR-6)."
table_type: "data_table"
primary_key:
  - "id"
columns:
  - name: "id"
    data_type: "VARCHAR"
    nullable: false
    description: "Primary key."
    length: 36
    key_type: "primary"
  - name: "project_id"
    data_type: "VARCHAR"
    nullable: false
    description: "Owning project."
    length: 36
    key_type: "foreign_one_to_many"
  - name: "name"
    data_type: "VARCHAR"
    nullable: false
    description: "Task name; unique within the project."
    length: 200
  - name: "status"
    data_type: "VARCHAR"
    nullable: false
    description: "Task status."
    length: 10
    validations:
      - type: "expect_column_values_to_be_in_set"
        kwargs:
          column: "status"
          value_set:
            - "active"
            - "completed"
            - "archived"
unique_constraints:
  -
    - "project_id"
    - "name"
relationships:
  foreign_keys:
    - column: "project_id"
      references_table: "projects"
      references_column: "id"
      type: "foreign_key"
