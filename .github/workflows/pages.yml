# Builds the Tempo microsite (documentor + Hugo/Hextra, with the UMF schema browser) and publishes it to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  DOCUMENTOR: "git+https://github.com/DocumentDrivenDX/helix@v0.19.1#subdirectory=tools/documentor"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.168.0", extended: true }
      - run: uvx --from "$DOCUMENTOR" documentor build --root .
      - uses: actions/upload-pages-artifact@v3
        with: { path: .helix/site/public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
